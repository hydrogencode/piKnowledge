name: verify-tested-tips
# Runs the stored tests of the command-tested tips on a clean runner. Never started by issues, so nothing a stranger
# writes is ever executed: tests.jsonl can only be changed by the repository owner.
on:
  push:
    branches: [main]
    paths:
      - knowledge/tests.jsonl
      - scripts/verify.py
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ajan-process
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests
        run: python scripts/verify.py
      - name: Commit the result
        run: |
          git config user.name "ajan-ortak-bot"
          git config user.email "ajan-ortak-bot@users.noreply.github.com"
          git add knowledge
          git diff --cached --quiet || git commit -m "Verification run" && git push || true
